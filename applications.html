<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Everlight - My Applications</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    header p {
      color: #d1d5db;
    }

    .container {
      padding: 25px 20px;
    }

    .back {
      color: #111827;
      text-decoration: none;
      font-weight: bold;
    }

    .application {
      background: white;
      padding: 22px;
      margin-top: 18px;
      border-radius: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .application h3 {
      margin-top: 0;
    }

    .company {
      color: #666;
      font-weight: bold;
    }

    .payment {
      font-weight: bold;
      font-size: 18px;
    }

    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 8px;
      background: #eee;
      font-weight: bold;
      margin-top: 8px;
    }

    .empty {
      text-align: center;
      color: #777;
      margin-top: 40px;
    }

    .jobs-button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Everlight</h1>
    <p>My Applications</p>
  </header>

  <div class="container">

    <a class="back" href="dashboard.html">
      ← Back to Dashboard
    </a>

    <h2>My Job Applications 📝</h2>

    <p>
      Track the jobs you've applied for.
    </p>

    <div id="applications"></div>

    <button
      class="jobs-button"
      onclick="findJobs()">

      Find More Jobs 💼

    </button>

  </div>

  <script>

    function loadApplications() {

      const applications =
        JSON.parse(
          localStorage.getItem("applications")
        ) || [];

      const container =
        document.getElementById("applications");

      container.innerHTML = "";

      if (applications.length === 0) {

        container.innerHTML =
          '<p class="empty">You have not applied for any jobs yet. 💼</p>';

        return;
      }

      applications.forEach(function(application) {

        const card =
          document.createElement("div");

        card.className = "application";

        card.innerHTML = `

          <h3>${application.jobTitle}</h3>

          <p class="company">
            🏢 ${application.company}
          </p>

          <p class="payment">
            💰 GHS ${Number(application.payment).toFixed(2)}
          </p>

          <p>
            Application Status:
          </p>

          <span class="status">
            ${application.status}
          </span>

        `;

        container.appendChild(card);

      });

    }


    function findJobs() {

      window.location.href = "jobs.html";

    }


    loadApplications();

  </script>

</body>
</html>
