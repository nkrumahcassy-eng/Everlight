<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Everlight - Jobs</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    header p {
      color: #d1d5db;
    }

    .container {
      padding: 25px 20px;
    }

    .back {
      color: #111827;
      text-decoration: none;
      font-weight: bold;
    }

    .job {
      background: white;
      padding: 22px;
      margin-top: 18px;
      border-radius: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .job h3 {
      margin-top: 0;
    }

    .company {
      color: #666;
      font-weight: bold;
    }

    .description {
      color: #555;
      line-height: 1.5;
    }

    .payment {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
    }

    .category {
      display: inline-block;
      padding: 6px 10px;
      background: #eee;
      border-radius: 6px;
      font-size: 13px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 15px;
      margin-top: 10px;
    }

    .empty {
      text-align: center;
      color: #777;
      margin-top: 40px;
    }

    .post-job {
      margin-top: 25px;
      display: block;
      text-align: center;
      color: #111827;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>Everlight</h1>
    <p>Find Opportunities. Build Your Future.</p>
  </header>

  <div class="container">

    <a class="back" href="dashboard.html">
      ← Back to Dashboard
    </a>

    <h2>Available Jobs 💼</h2>

    <p>
      Find work that matches your skills.
    </p>

    <div id="jobs"></div>

    <a class="post-job" href="post-job.html">
      Are you an employer? → Post a Job
    </a>

  </div>


  <script>

    function loadJobs() {

      const jobs =
        JSON.parse(
          localStorage.getItem("everlightJobs")
        ) || [];


      const container =
        document.getElementById("jobs");


      container.innerHTML = "";


      if (jobs.length === 0) {

        container.innerHTML =
          '<p class="empty">No jobs available yet. Check back soon! 🚀</p>';

        return;
      }


      jobs.forEach(function(job) {

        const card =
          document.createElement("div");

        card.className = "job";


        card.innerHTML = `

          <h3>${job.title}</h3>

          <p class="company">
            🏢 ${job.company}
          </p>

          <span class="category">
            ${job.category}
          </span>

          <p class="description">
            ${job.description}
          </p>

          <p class="payment">
            💰 GHS ${Number(job.payment).toFixed(2)}
          </p>

          <button onclick="applyForJob(${job.id})">
            Apply for Job
          </button>

        `;


        container.appendChild(card);

      });

    }


    function applyForJob(jobId) {

      const jobs =
        JSON.parse(
          localStorage.getItem("everlightJobs")
        ) || [];


      const job =
        jobs.find(function(item) {

          return item.id === jobId;

        });


      if (!job) {

        alert("Job could not be found.");

        return;

      }


      const applications =
        JSON.parse(
          localStorage.getItem("applications")
        ) || [];


      applications.push({

        id: Date.now(),

        jobId: job.id,

        jobTitle: job.title,

        company: job.company,

        payment: job.payment,

        status: "Pending"

      });


      localStorage.setItem(
        "applications",
        JSON.stringify(applications)
      );


      alert(
        "🎉 Application submitted successfully!"
      );

    }


    loadJobs();

  </script>

</body>
</html>
