<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Everlight - Post a Job</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    header p {
      color: #d1d5db;
    }

    .container {
      padding: 25px 20px;
    }

    .back {
      color: #111827;
      text-decoration: none;
      font-weight: bold;
    }

    .form-box {
      background: white;
      padding: 25px;
      margin-top: 25px;
      border-radius: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>Everlight</h1>
    <p>Connect Talent With Opportunity</p>
  </header>

  <div class="container">

    <a class="back" href="dashboard.html">
      ← Back to Dashboard
    </a>

    <div class="form-box">

      <h2>Post a Job 💼</h2>

      <p>
        Tell talented people what you're looking for.
      </p>

      <form onsubmit="postJob(event)">

        <label for="title">
          Job Title
        </label>

        <input
          type="text"
          id="title"
          placeholder="e.g. Social Media Designer"
          required
        >


        <label for="category">
          Category
        </label>

        <select id="category" required>

          <option value="">
            Select a category
          </option>

          <option value="Web Development">
            Web Development
          </option>

          <option value="Graphic Design">
            Graphic Design
          </option>

          <option value="Video Editing">
            Video Editing
          </option>

          <option value="Voice Over">
            Voice Over
          </option>

          <option value="Digital Marketing">
            Digital Marketing
          </option>

        </select>


        <label for="description">
          Job Description
        </label>

        <textarea
          id="description"
          placeholder="Describe the work..."
          required
        ></textarea>


        <label for="payment">
          Payment (GHS)
        </label>

        <input
          type="number"
          id="payment"
          placeholder="e.g. 500"
          min="1"
          required
        >


        <label for="company">
          Company / Client Name
        </label>

        <input
          type="text"
          id="company"
          placeholder="e.g. ABC Creative"
          required
        >


        <button type="submit">
          Publish Job 🚀
        </button>

      </form>

      <p id="message"></p>

    </div>

  </div>


  <script>

    function postJob(event) {

      event.preventDefault();


      const title =
        document.getElementById("title").value;

      const category =
        document.getElementById("category").value;

      const description =
        document.getElementById("description").value;

      const payment =
        document.getElementById("payment").value;

      const company =
        document.getElementById("company").value;


      const jobs =
        JSON.parse(
          localStorage.getItem("everlightJobs")
        ) || [];


      jobs.push({

        id: Date.now(),

        title: title,

        category: category,

        description: description,

        payment: payment,

        company: company

      });


      localStorage.setItem(
        "everlightJobs",
        JSON.stringify(jobs)
      );


      document.getElementById("message")
        .textContent =
        "🎉 Job published successfully!";


      document.querySelector("form").reset();

    }

  </script>

</body>
</html>
