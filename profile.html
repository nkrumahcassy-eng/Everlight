<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Everlight - My Profile</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    header p {
      color: #d1d5db;
    }

    .container {
      padding: 25px 20px;
    }

    .back {
      color: #111827;
      text-decoration: none;
      font-weight: bold;
    }

    .profile-card {
      background: white;
      padding: 25px;
      margin-top: 25px;
      border-radius: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 20px;
    }

    .info {
      margin: 15px 0;
      padding: 12px;
      background: #f5f7fb;
      border-radius: 8px;
    }

    .info strong {
      display: block;
      margin-bottom: 5px;
    }

    .edit-button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Everlight</h1>
    <p>My Profile</p>
  </header>

  <div class="container">

    <a class="back" href="dashboard.html">
      ← Back to Dashboard
    </a>

    <div class="profile-card">

      <div class="avatar" id="avatar">
        👤
      </div>

      <h2 id="userName">Loading...</h2>

      <div class="info">
        <strong>Email</strong>
        <span id="userEmail">Loading...</span>
      </div>

      <div class="info">
        <strong>Learning</strong>
        <span>Web Development — In Progress 📚</span>
      </div>

      <div class="info">
        <strong>Applications</strong>
        <span id="applicationCount">0 applications</span>
      </div>

      <div class="info">
        <strong>Skills</strong>
        <span>Start adding your skills as you learn.</span>
      </div>

      <button class="edit-button" onclick="editProfile()">
        Edit Profile
      </button>

    </div>

  </div>

  <script>

    const savedUser =
      JSON.parse(localStorage.getItem("everlightUser"));

    if (!savedUser) {

      window.location.href = "login.html";

    } else {

      document.getElementById("userName").textContent =
        savedUser.name;

      document.getElementById("userEmail").textContent =
        savedUser.email;

      const firstLetter =
        savedUser.name.charAt(0).toUpperCase();

      document.getElementById("avatar").textContent =
        firstLetter;
    }

    const applications =
      JSON.parse(localStorage.getItem("applications")) || [];

    document.getElementById("applicationCount").textContent =
      applications.length + " application" +
      (applications.length === 1 ? "" : "s");

    function editProfile() {

      alert(
        "Profile editing will be added next. 🚀"
      );

    }

  </script>

</body>
</html>
